# LineMedic 보호 pytest 설정 (W10, spec 06 §4). runner image에 넣고 image ID로 고정한다.
# repo의 pytest.ini·tox.ini·setup.cfg·pyproject.toml·conftest.py는 쓰지 않는다(`-c`로 이 파일만 읽는다).
# plugin 자동 로드는 env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1로 막고, cacheprovider·conftest는 argv로도 끈다.
# xfail·skip은 통과도 실패도 아니다(판정에서 재현·통과로 치지 않는다). xfail이 통과하면 실패로 본다.
[pytest]
addopts = -p no:cacheprovider --noconftest --strict-markers --strict-config
junit_family = xunit2
junit_logging = no
xfail_strict = true
